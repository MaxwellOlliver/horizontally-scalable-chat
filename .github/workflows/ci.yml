name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: TypeScript (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Go workspace is linted/tested in the `go` job below.
      - run: pnpm turbo run lint typecheck test --filter='!@hsc/ws-gateway-go'

  go:
    name: Go gateway (lint · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/ws-gateway-go/go.mod
          cache-dependency-path: apps/ws-gateway-go/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: apps/ws-gateway-go
      - name: Test
        working-directory: apps/ws-gateway-go
        run: go test ./...
