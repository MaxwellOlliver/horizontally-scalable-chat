name: hsc-auth

# Auth stack (T9): Postgres + auth-service (app tier) + ws-gateway-go + Nginx.
# Nginx routes /auth/* to the app and the WS upgrade to the gateway. The shared
# JWT secret + issuer reach BOTH services from a single source (.env), which is
# the cross-language contract that lets the gateway verify tokens locally
# (specs/auth.spec.md §2.8, AC-W2). See .env.example.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hsc}
    # Published so a service run locally (outside compose) can reach the DB at
    # localhost:${POSTGRES_PORT}. The in-compose services still connect over the
    # internal network via the `postgres` hostname on 5432.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hsc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply Drizzle migrations before the app starts. Uses the build
  # stage (which still has drizzle-kit / dev deps) rather than the slim runtime.
  migrate:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: build
    working_dir: /repo/services/auth-service
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hsc}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: runtime
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hsc}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-hsc-auth}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-600}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1296000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  # One-shot: apply chat-service's Drizzle migrations (conversations, messages,
  # friends_read_model) before chat-service starts.
  migrate-chat:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
      target: build
    working_dir: /repo/services/chat-service
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hsc}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Published so a service run locally (outside compose) can reach it at
    # localhost:${REDIS_PORT}. In-compose services use redis://redis:6379.
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Event bus: topic exchange `domain.events` carrying friend_request.* and
  # friendship.removed integration events (specs/friends.specs.md §2.4a).
  # The management UI (15672) is handy for inspecting exchanges/queues locally.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Messaging app tier (messaging spec): consumes the inbound work queue +
  # friend events, owns conversations/messages/friends_read_model, serves history.
  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
      target: runtime
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hsc}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-hsc-auth}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      DOMAIN_EVENTS_EXCHANGE: ${DOMAIN_EVENTS_EXCHANGE:-domain.events}
      INBOUND_QUEUE: ${INBOUND_QUEUE:-chat.inbound}
      FRIEND_EVENTS_QUEUE: ${FRIEND_EVENTS_QUEUE:-chat.friend-events}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate-chat:
        condition: service_completed_successfully
    expose:
      - "3002"

  ws-gateway-go:
    build:
      context: .
      dockerfile: apps/ws-gateway-go/Dockerfile
    environment:
      PORT: 8080
      # SAME secret + issuer as auth-service — verifies access tokens locally,
      # never calls the app tier (spec §2.8, AC-W2).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-hsc-auth}
      WS_AUTH_TIMEOUT_SECONDS: ${WS_AUTH_TIMEOUT_SECONDS:-5}
      # Cross-instance presence store (REQUIREMENTS §5) + outbound per-user
      # delivery channels (messaging spec §2.3). Shared by every gateway replica.
      REDIS_URL: redis://redis:6379
      PRESENCE_TTL_SECONDS: ${PRESENCE_TTL_SECONDS:-30}
      # Inbound client-message work queue published to chat-service (spec §2.2).
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      INBOUND_QUEUE: ${INBOUND_QUEUE:-chat.inbound}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - auth-service
      - ws-gateway-go

volumes:
  pgdata:
  rabbitmqdata:
