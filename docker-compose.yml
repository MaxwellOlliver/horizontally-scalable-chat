name: hsc-relay

# Full local stack for the horizontally-scalable chat.
#
#   Infrastructure : postgres · redis · rabbitmq
#   Migrations     : migrate-auth · migrate-social · migrate-chat (one-shots)
#   App tiers      : auth-service · social-service · chat-service
#   Gateway        : ws-gateway-go (WebSocket)
#   Edge           : nginx (routes /auth /social /chat /presence /ws)
#   Client         : web (Relay SPA served by nginx; proxies /api -> edge)
#
# Ordering is driven by HEALTHCHECKS, not guesswork: each app tier waits for the
# infrastructure it uses to be *healthy* (not merely started) and for its
# migration one-shot to complete; nginx waits for every upstream to be healthy
# before it boots. The shared JWT secret + issuer reach every service from one
# source (.env) — the cross-language contract that lets the gateway verify
# tokens locally (specs/auth.spec.md §2.8). See .env.example.
#
# HORIZONTAL SCALING (the point of this project). The app tiers and gateway are
# stateless and use `expose` (no host port) + no container_name, so they scale:
#
#   docker compose up -d --build --scale chat-service=3 --scale ws-gateway-go=2
#
# Each replica derives a distinct instance id from its container hostname
# (@hsc/platform resolveInstanceId / logstream.ResolveInstanceID), surfaced in
# the client's activity log. nginx round-robins the HTTP tiers and least_conn's
# the gateway (infra/nginx/nginx.conf); the chat work queue load-balances via
# competing consumers; cross-instance delivery rides Redis pub/sub. Bring the
# replica set up together — nginx resolves the gateway pool once at boot.

x-postgres-url: &postgres-url postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hsc}

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hsc}
    # Published so a service run locally (outside compose) can reach the DB at
    # localhost:${POSTGRES_PORT}. In-compose services use the `postgres` hostname.
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hsc}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Per-user pub/sub delivery channels (user:{id}); no persistence needed.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    # Topic exchange `domain.events` (friend events) + the chat inbound work
    # queue. Management UI on 15672 is handy for inspecting exchanges/queues.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    healthcheck:
      # check_port_connectivity verifies the AMQP listener (5672) is actually
      # accepting — a plain `ping` passes before the port is up, which is what
      # raced chat-service's consumer on a fresh boot.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------- migrations
  # One-shots: each service owns its tables and migrates into the same DB with an
  # isolated bookkeeping table (drizzle.config migrations.table), so no service's
  # migrations are skipped by another's timestamp.
  migrate-auth:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: build
    working_dir: /repo/services/auth-service
    command: ['pnpm', 'db:migrate']
    environment:
      DATABASE_URL: *postgres-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  migrate-social:
    build:
      context: .
      dockerfile: services/social-service/Dockerfile
      target: build
    working_dir: /repo/services/social-service
    command: ['pnpm', 'db:migrate']
    environment:
      DATABASE_URL: *postgres-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  migrate-chat:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
      target: build
    working_dir: /repo/services/chat-service
    command: ['pnpm', 'db:migrate']
    environment:
      DATABASE_URL: *postgres-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # --------------------------------------------------------------------- app tiers
  # Identity: /auth/* — issues & verifies tokens, owns users + refresh tokens.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: *postgres-url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-hsc-auth}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-600}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1296000}
      # Observability log stream — publishes per-user log frames the gateway relays.
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-auth:
        condition: service_completed_successfully
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Friends: /social/* — friend requests + friendships; emits domain events to
  # RabbitMQ and pushes live list-update frames via Redis.
  social-service:
    build:
      context: .
      dockerfile: services/social-service/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: *postgres-url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-hsc-auth}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      DOMAIN_EVENTS_EXCHANGE: ${DOMAIN_EVENTS_EXCHANGE:-domain.events}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate-social:
        condition: service_completed_successfully
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Messaging: /chat/* — consumes the inbound work queue + friend events, owns
  # conversations/messages/friends_read_model, serves history.
  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_URL: *postgres-url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-hsc-auth}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      DOMAIN_EVENTS_EXCHANGE: ${DOMAIN_EVENTS_EXCHANGE:-domain.events}
      INBOUND_QUEUE: ${INBOUND_QUEUE:-chat.inbound}
      FRIEND_EVENTS_QUEUE: ${FRIEND_EVENTS_QUEUE:-chat.friend-events}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate-chat:
        condition: service_completed_successfully
    expose:
      - '3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------- gateway
  ws-gateway-go:
    build:
      context: .
      dockerfile: apps/ws-gateway-go/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      # SAME secret + issuer as auth-service — verifies access tokens locally,
      # never calls the app tier (spec §2.8, AC-W2).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-hsc-auth}
      WS_AUTH_TIMEOUT_SECONDS: ${WS_AUTH_TIMEOUT_SECONDS:-5}
      PRESENCE_TTL_SECONDS: ${PRESENCE_TTL_SECONDS:-30}
      # Outbound per-user delivery channels (spec §2.3) + cross-instance presence.
      REDIS_URL: redis://redis:6379
      # Inbound client-message work queue published to chat-service (spec §2.2).
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      INBOUND_QUEUE: ${INBOUND_QUEUE:-chat.inbound}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - '8080'
    healthcheck:
      # Distroless image: the binary health-checks itself (no shell/curl).
      test: ['CMD', '/ws-gateway-go', '-healthcheck']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # -------------------------------------------------------------------------- edge
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${HTTP_PORT:-8080}:80'
    # Every upstream healthy before nginx boots, so the static upstreams resolve.
    depends_on:
      auth-service:
        condition: service_healthy
      social-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      ws-gateway-go:
        condition: service_healthy

  # ------------------------------------------------------------------------ client
  # The Relay SPA (apps/web). Built to static assets and served by its own nginx,
  # which also proxies the same-origin /api/* prefix (stripped) to the edge front
  # door — mirroring the dev Vite proxy so the client speaks same-origin. Open the
  # app at http://localhost:${WEB_PORT}.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:80'
    # The edge owns /api routing; wait for it so the first requests don't 502.
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  rabbitmqdata:
