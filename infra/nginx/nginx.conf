# Nginx front door (spec §2.1, task T9).
#   /auth/*    -> auth-service   (HTTP app tier)
#   /social/*  -> social-service (friends API)
#   /chat/*    -> chat-service   (message history API)
#   /presence/ -> ws-gateway-go  (read-only presence lookups)
#   /ws        -> ws-gateway-go  (WebSocket upgrade)
#
# Two load-balancing strategies, chosen per tier:
#
#   HTTP tiers (/auth /social /chat) — resolved at REQUEST time via Docker's
#   embedded DNS + a variable in proxy_pass, NOT once at boot. Docker reassigns a
#   new IP whenever a container is recreated (e.g. `docker compose up -d --build
#   chat-service`); a static upstream caches the IP at boot and 502s until nginx
#   restarts. Deferred resolution re-resolves per `valid` window AND naturally
#   round-robins across all replica A-records — ideal for stateless, uniform,
#   short requests.
#
#   Gateway (/ws, /presence) — a static `upstream` with `least_conn`. WebSocket
#   connections are long-lived and uneven, so balancing by active-connection
#   count beats round-robin. `least_conn` requires an upstream block, which can't
#   re-resolve in open-source nginx; the name resolves ALL replica IPs once at
#   boot (Docker DNS returns every replica's A-record), so bring the gateway pool
#   up together. Rebuilding a gateway replica mid-session needs a `docker compose
#   restart nginx` to pick up its new IP.
#
# In deploy, TLS terminates here (HTTPS for the APIs, WSS for /ws) and the
# upstreams stay plain HTTP/WS inside the network; this local config listens on
# plain :80.

events {}

http {
  # Map the Upgrade header so WebSocket connections get `Connection: upgrade`
  # and everything else gets `Connection: close`.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker's embedded DNS resolver. `valid` re-resolves periodically so a
  # rebuilt/restarted container picking up a new IP is followed (HTTP tiers).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Gateway pool — least_conn across all ws-gateway-go replicas. A single
  # `server` line expands to one peer per replica IP that `ws-gateway-go`
  # resolves to at boot (Docker DNS returns every replica's A-record).
  upstream gateway {
    least_conn;
    server ws-gateway-go:8080;
  }

  server {
    listen 80;

    # HTTP auth API. The full /auth/* prefix is forwarded unchanged, so
    # /auth/register, /auth/login, /auth/refresh, /auth/logout hit the app.
    location /auth/ {
      set $auth_upstream auth-service:3000;
      proxy_pass http://$auth_upstream$request_uri;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Friends API. /social/friends/* is forwarded unchanged to social-service.
    location /social/ {
      set $social_upstream social-service:3001;
      proxy_pass http://$social_upstream$request_uri;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Message history + conversation API. (Sending is async over the WS + work
    # queue, not HTTP.)
    location /chat/ {
      set $chat_upstream chat-service:3002;
      proxy_pass http://$chat_upstream$request_uri;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Read-only presence lookups -> gateway pool (least_conn upstream).
    location /presence/ {
      proxy_pass http://gateway;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket upgrade -> gateway pool (least_conn). The gateway runs the
    # first-frame auth protocol itself (it does not read headers for the token).
    location /ws {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Long-lived connections: don't let the proxy time out an idle-but-alive
      # socket. Reconnect/resync (AC-C2) is driven by the client, not the proxy.
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }
  }
}
