# Nginx front door (spec §2.1, task T9).
#   /auth/*    -> auth-service   (HTTP app tier)
#   /social/*  -> social-service (friends API)
#   /chat/*    -> chat-service   (message history API)
#   /presence/ -> ws-gateway-go  (read-only presence lookups)
#   /ws        -> ws-gateway-go  (WebSocket upgrade)
#
# Upstreams are resolved at REQUEST time via Docker's embedded DNS + a variable
# in proxy_pass — NOT once at boot. Two distinct reasons, both real:
#   - startup ordering is handled by healthchecks + depends_on (compose), but
#   - Docker reassigns a new IP whenever a container is recreated (e.g. you
#     rebuild a single service: `docker compose up -d --build chat-service`).
#     A static `upstream { server name; }` caches the IP at boot and never
#     re-resolves, so the rebuilt service becomes unreachable (502) until nginx
#     itself is restarted. Deferred resolution re-resolves per `valid` window,
#     so a rebuilt backend is picked up automatically.
#
# In deploy, TLS terminates here (HTTPS for the APIs, WSS for /ws) and the
# upstreams stay plain HTTP/WS inside the network; this local config listens on
# plain :80.

events {}

http {
  # Map the Upgrade header so WebSocket connections get `Connection: upgrade`
  # and everything else gets `Connection: close`.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker's embedded DNS resolver. `valid` re-resolves periodically so a
  # rebuilt/restarted container picking up a new IP is followed.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    # HTTP auth API. The full /auth/* prefix is forwarded unchanged, so
    # /auth/register, /auth/login, /auth/refresh, /auth/logout hit the app.
    location /auth/ {
      set $auth_upstream auth-service:3000;
      proxy_pass http://$auth_upstream$request_uri;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Friends API. /social/friends/* is forwarded unchanged to social-service.
    location /social/ {
      set $social_upstream social-service:3001;
      proxy_pass http://$social_upstream$request_uri;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Message history + conversation API. (Sending is async over the WS + work
    # queue, not HTTP.)
    location /chat/ {
      set $chat_upstream chat-service:3002;
      proxy_pass http://$chat_upstream$request_uri;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Read-only presence lookups -> gateway (observability; future friend-presence).
    location /presence/ {
      set $gateway_upstream ws-gateway-go:8080;
      proxy_pass http://$gateway_upstream$request_uri;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket upgrade -> gateway. The gateway runs the first-frame auth
    # protocol itself (it does not read headers for the token).
    location /ws {
      set $gateway_upstream ws-gateway-go:8080;
      proxy_pass http://$gateway_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Long-lived connections: don't let the proxy time out an idle-but-alive
      # socket. Reconnect/resync (AC-C2) is driven by the client, not the proxy.
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }
  }
}
