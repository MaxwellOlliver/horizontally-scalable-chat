# Relay SPA front door. Serves the built static assets and proxies the
# same-origin /api/* prefix (stripped) to the edge nginx, which owns all backend
# routing + load balancing. This mirrors the dev Vite proxy (apps/web/vite.config.ts)
# so the client speaks same-origin in every environment — no CORS, and the WS URL
# is just derived from the page origin.

events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Map the Upgrade header so the WebSocket hop gets `Connection: upgrade`.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker's embedded DNS; `valid` re-resolves so a recreated edge container
  # (new IP) is followed without restarting this one.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    root   /usr/share/nginx/html;
    index  index.html;

    # WebSocket upgrade: /api/ws -> edge /ws (longest-prefix match beats /api/).
    # Carries the upgrade headers and the long timeouts a live socket needs.
    location /api/ws {
      set $edge nginx:80;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$edge;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # REST API: /api/* -> edge /* (prefix stripped). The edge routes /auth /social
    # /chat /presence to the app tiers.
    location /api/ {
      set $edge nginx:80;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$edge;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve the requested file, else fall back to index.html so the client
    # router owns the rest of the path space (e.g. /chat/:friendId).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
