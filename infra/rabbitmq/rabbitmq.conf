# RabbitMQ broker config (specs/friends.specs.md §2.4a — domain.events topic
# exchange). Mounted into the container the same way infra/nginx/nginx.conf is.
#
# By default RabbitMQ restricts the built-in `guest` user to loopback
# connections, so `amqp://guest:guest@rabbitmq:5672` from another container
# would be refused. This lifts that restriction for the local dev / study stack
# so services on the compose network can authenticate as guest.
loopback_users = none
